name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gen:api-types --workspace=@app/web
      - run: git diff --exit-code apps/api/openapi.json apps/web/src/lib/api-schema.ts
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present
      - run: npm test
      - run: npm run build
