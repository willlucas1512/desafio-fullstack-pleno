name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub define CI=true automaticamente nos runners. Os runners ubuntu já têm
# Docker, então os testes de paridade do Postgres (Testcontainers) rodam de fato
# — e falham alto se o Docker faltar, em vez de pular silenciosamente.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Garante que os tipos do front (api-schema.ts) e o openapi.json estão em
      # sincronia com os schemas Zod da API. Se alguém mudou a API sem regerar,
      # o git diff falha aqui.
      - run: npm run gen:api-types --workspace=@app/web
      - run: git diff --exit-code apps/api/openapi.json apps/web/src/lib/api-schema.ts
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present
      - run: npm test
      - run: npm run build
